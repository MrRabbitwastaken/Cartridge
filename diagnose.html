<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartridge Network Diagnostic</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#111; color:#eee; padding:16px; font-size:15px; line-height:1.5; }
  h1 { font-size:18px; }
  .row { padding:10px; margin-bottom:8px; border-radius:8px; background:#222; }
  .pass { border-left:5px solid #4caf50; }
  .fail { border-left:5px solid #f44336; }
  .pending { border-left:5px solid #999; }
  .label { font-weight:bold; }
  .detail { font-size:13px; color:#aaa; margin-top:4px; word-break:break-all; }
  button { padding:12px 20px; font-size:16px; border-radius:8px; border:none; background:#4caf50; color:#fff; margin-top:16px; width:100%; }
  textarea { width:100%; height:160px; margin-top:12px; font-size:12px; background:#000; color:#0f0; border:1px solid #444; }
</style>
</head>
<body>
<h1>Cartridge Network Diagnostic</h1>
<p>This page tests a few things directly on this device. Tap "Copy results" at the bottom when it finishes and send them back.</p>
<div id="results"></div>
<button id="copyBtn" style="display:none">Copy results</button>
<textarea id="output" style="display:none" readonly></textarea>

<script>
const resultsEl = document.getElementById('results');
const rows = {};
const log = [];

function addRow(id, label){
  const div = document.createElement('div');
  div.className = 'row pending';
  div.id = 'row-' + id;
  div.innerHTML = `<div class="label">${label}</div><div class="detail">running…</div>`;
  resultsEl.appendChild(div);
  rows[id] = div;
}

function setResult(id, label, pass, detail, ms){
  const div = rows[id];
  div.className = 'row ' + (pass ? 'pass' : 'fail');
  const timing = (typeof ms === 'number') ? ` (${ms}ms)` : '';
  div.innerHTML = `<div class="label">${pass ? '✅' : '❌'} ${label}${timing}</div><div class="detail">${detail}</div>`;
  log.push(`${label}: ${pass ? 'PASS' : 'FAIL'}${timing} - ${detail}`);
}

function timedScriptLoad(url, timeoutMs){
  const start = performance.now();
  return new Promise((resolve) => {
    const script = document.createElement('script');
    let settled = false;
    const timer = setTimeout(() => {
      if(settled) return;
      settled = true;
      cleanup();
      resolve({ ok:false, reason:'timeout', ms: Math.round(performance.now()-start) });
    }, timeoutMs || 6000);
    function cleanup(){
      clearTimeout(timer);
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    script.onload = function(){
      if(settled) return;
      settled = true;
      cleanup();
      resolve({ ok:true, reason:'loaded', ms: Math.round(performance.now()-start) });
    };
    script.onerror = function(){
      if(settled) return;
      settled = true;
      cleanup();
      resolve({ ok:false, reason:'onerror (blocked, DNS failure, or network refused)', ms: Math.round(performance.now()-start) });
    };
    script.src = url;
    document.head.appendChild(script);
  });
}

function timedJsonpLoad(url, cbParam, timeoutMs){
  const start = performance.now();
  return new Promise((resolve) => {
    const cbName = '__diagCb' + Date.now();
    const script = document.createElement('script');
    let settled = false;
    const timer = setTimeout(() => {
      if(settled) return;
      settled = true;
      cleanup();
      resolve({ ok:false, reason:'timeout', ms: Math.round(performance.now()-start) });
    }, timeoutMs || 6000);
    function cleanup(){
      delete window[cbName];
      clearTimeout(timer);
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(data){
      if(settled) return;
      settled = true;
      cleanup();
      resolve({ ok:true, reason:'callback fired, got data', ms: Math.round(performance.now()-start) });
    };
    script.onerror = function(){
      if(settled) return;
      settled = true;
      cleanup();
      resolve({ ok:false, reason:'onerror (blocked, DNS failure, or network refused)', ms: Math.round(performance.now()-start) });
    };
    script.src = url + (url.includes('?') ? '&' : '?') + cbParam + '=' + cbName;
    document.head.appendChild(script);
  });
}

function timedFetch(url, opts, timeoutMs){
  const start = performance.now();
  const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = setTimeout(() => { if(controller) controller.abort(); }, timeoutMs || 6000);
  return fetch(url, Object.assign({}, opts, controller ? { signal: controller.signal } : {}))
    .then(r => ({ ok: true, reason: 'HTTP ' + r.status, ms: Math.round(performance.now()-start) }))
    .catch(err => ({ ok:false, reason:(err && err.name ? err.name : 'error') + ': ' + (err && err.message ? err.message : ''), ms: Math.round(performance.now()-start) }))
    .finally(() => clearTimeout(timer));
}

async function runTests(){
  log.push('User-Agent: ' + navigator.userAgent);
  log.push('Page origin: ' + location.origin);
  log.push('navigator.onLine: ' + navigator.onLine);

  // Test 1: JSONP script-tag load from itunes.apple.com (exactly what the game does)
  addRow('itunesJsonp', 'iTunes JSONP script load');
  const r1 = await timedJsonpLoad('https://itunes.apple.com/search?term=test&media=music&limit=1', 'callback', 6000);
  setResult('itunesJsonp', 'iTunes JSONP script load', r1.ok, r1.reason, r1.ms);

  // Test 2: plain script tag load from itunes.apple.com (no JSONP callback, just raw JSON response as a script - expected to fail to PARSE but should still fire onload if the resource loads at all, since script tags don't care about MIME/content for firing onload vs onerror... actually onerror only fires on network/load failure, not parse failure, so this isolates network-level blocking from execution-level issues)
  addRow('itunesRaw', 'iTunes raw script-tag load (network-only test)');
  const r2 = await timedScriptLoad('https://itunes.apple.com/search?term=test&media=music&limit=1', 6000);
  setResult('itunesRaw', 'iTunes raw script-tag load (network-only test)', r2.ok || r2.reason === 'loaded', r2.reason, r2.ms);

  // Test 3: fetch() to itunes.apple.com
  addRow('itunesFetch', 'iTunes fetch() (mode: cors)');
  const r3 = await timedFetch('https://itunes.apple.com/search?term=test&media=music&limit=1', { mode: 'cors' }, 6000);
  setResult('itunesFetch', 'iTunes fetch() (mode: cors)', r3.ok, r3.reason, r3.ms);

  // Test 4: control - script tag load from a totally different, unrelated CDN domain
  addRow('controlScript', 'Control: script-tag load from jsdelivr.net');
  const r4 = await timedScriptLoad('https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js', 6000);
  setResult('controlScript', 'Control: script-tag load from jsdelivr.net', r4.ok, r4.reason, r4.ms);

  // Test 5: control - fetch() to a different, unrelated, CORS-friendly API
  addRow('controlFetch', 'Control: fetch() to api.github.com');
  const r5 = await timedFetch('https://api.github.com', { mode: 'cors' }, 6000);
  setResult('controlFetch', 'Control: fetch() to api.github.com', r5.ok, r5.reason, r5.ms);

  // Test 6: control - script tag load from a second Apple domain, to see if it's itunes.apple.com specifically or all of apple.com
  addRow('appleControl', 'Control: script-tag load from apple.com');
  const r6 = await timedScriptLoad('https://www.apple.com/favicon.ico', 6000);
  setResult('appleControl', 'Control: script-tag load from apple.com', true, r6.reason + ' (note: favicon isn\'t real JS, so a "loaded" here that errors is fine - we only care if it reaches the network at all, not fail differently than itunes did)', r6.ms);

  document.getElementById('output').value = log.join('\n');
  document.getElementById('output').style.display = 'block';
  document.getElementById('copyBtn').style.display = 'block';
}

document.getElementById('copyBtn').addEventListener('click', function(){
  const ta = document.getElementById('output');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try{
    document.execCommand('copy');
    this.textContent = 'Copied!';
  }catch(e){
    // fall back to navigator.clipboard
    navigator.clipboard && navigator.clipboard.writeText(ta.value).then(()=>{ this.textContent = 'Copied!'; });
  }
});

runTests();
</script>
</body>
</html>
