<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c3a">
<title>Meal Cart Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column, phone first. Sticky header, content, bottom tab bar. Same green-on-paper look as the Chrome extension. */
:root {
  --paper: #f6f8f5; --card: #ffffff; --ink: #17261c; --muted: #5d6b61; --line: #d5ddd6;
  --leaf: #1f5c3a; --leaf-ink: #ffffff; --leaf-soft: #e3efe7; --tomato: #c8321f; --star: #d99a12;
  --font: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121a15; --card: #1a251e; --ink: #e8f0ea; --muted: #9bab9f; --line: #2c3a31;
  --leaf: #4fae78; --leaf-ink: #0c1a11; --leaf-soft: #1f3327; --tomato: #ee7a68; --star: #e8b43c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #121a15; --card: #1a251e; --ink: #e8f0ea; --muted: #9bab9f; --line: #2c3a31;
  --leaf: #4fae78; --leaf-ink: #0c1a11; --leaf-soft: #1f3327; --tomato: #ee7a68; --star: #e8b43c; color-scheme: dark; }
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.4 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); padding: 12px 0 8px; border-bottom: 1px solid var(--line); }
.hrow { display: flex; align-items: center; gap: 10px; }
h1 { margin: 0; font-size: 19px; letter-spacing: -0.01em; flex: 1; }
h2 { margin: 18px 0 6px; font-size: 14px; letter-spacing: .02em; }
h3 { margin: 14px 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
main { flex: 1; padding: 8px 0 96px; }
ul { list-style: none; margin: 0; padding: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 14px; min-height: 40px; }
.btn.primary { background: var(--leaf); color: var(--leaf-ink); border-color: var(--leaf); font-weight: 600; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.link { background: none; border: 0; color: var(--leaf); padding: 6px 4px; font-weight: 600; }
.link.muted { color: var(--muted); font-weight: 400; }
.link.danger { color: var(--tomato); }
.hint { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
input[type=text], input[type=number], select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); min-height: 40px; }
input[type=checkbox] { accent-color: var(--leaf); width: 22px; height: 22px; flex: none; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

.seg { display: flex; gap: 4px; margin: 8px 0 0; }
.seg button { flex: 1; padding: 8px 0; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; min-height: 38px; }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg.meal button[aria-selected="true"] { background: var(--leaf); color: var(--leaf-ink); border-color: var(--leaf); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 0; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 11px; font-size: 13px; min-height: 30px; }
.chip[aria-pressed="true"] { background: var(--leaf-soft); color: var(--leaf); border-color: var(--leaf); font-weight: 600; }
.tools { display: flex; gap: 8px; margin: 8px 0 0; }
.tools select { width: auto; flex: none; }

.recipes > li { border-bottom: 1px solid var(--line); padding: 6px 0; }
.rrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.rrow .grow { flex: 1; min-width: 0; }
.rname { font-weight: 600; overflow-wrap: anywhere; }
.rmeta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 2px 8px; }
.dt { color: var(--leaf); }
.star { border: 0; background: none; padding: 6px; color: var(--muted); line-height: 0; }
.star svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.star[aria-pressed="true"] { color: var(--star); }
.star[aria-pressed="true"] svg { fill: currentColor; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.stepper button { border: 0; background: none; width: 34px; height: 34px; font-size: 18px; }
.stepper span { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.on > .rrow .rname { color: var(--leaf); }
.rextra { padding: 0 0 8px 32px; }
.rextra .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 2px 0 6px; }
.rextra select { width: auto; min-height: 34px; padding: 4px 8px; }
.ings li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ings li.off .iname { text-decoration: line-through; color: var(--muted); }
.ings .iname { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ings .iqty { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--muted); margin-left: 6px; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }

/* shop */
.prog { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
.prog i { display: block; height: 100%; background: var(--leaf); width: 0; transition: width .2s; }
.shop-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.aisle { margin-top: 14px; }
.aisle h3 { margin: 0 0 2px; display: flex; justify-content: space-between; }
.item { display: flex; align-items: center; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); min-height: 54px; }
.item label { flex: 1; display: flex; align-items: center; gap: 12px; min-height: 54px; cursor: pointer; min-width: 0; }
.item .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item .nm small { display: block; color: var(--muted); font-size: 12.5px; }
.item .ct { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.item.done .nm { text-decoration: line-through; color: var(--muted); }
.item.done .nm small { text-decoration: none; }
.item .x { border: 0; background: none; color: var(--muted); padding: 10px; font-size: 13px; }
.addrow { display: flex; gap: 8px; margin: 10px 0 0; }
.addrow button { flex: none; }

/* planner */
.pl-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 8px; }
.pl-head h2 { margin: 0; }
.pl-head button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; width: 40px; height: 40px; font-size: 20px; }
.day { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 8px 12px; margin: 0 0 8px; }
.day.today { border-color: var(--leaf); box-shadow: inset 3px 0 0 var(--leaf); }
.day h4 { margin: 0 0 2px; display: flex; justify-content: space-between; font-size: 14px; }
.day h4 small { font-weight: 400; color: var(--muted); }
.day li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.day li .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.day .add { width: 100%; text-align: left; border: 1px dashed var(--line); background: none; border-radius: 8px; padding: 8px 10px; color: var(--muted); min-height: 38px; margin-top: 4px; }

/* essentials / lists */
.crow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.crow .grow { flex: 1; min-width: 0; }
.crow input[type=text] { margin-top: 4px; min-height: 34px; padding: 5px 8px; font-size: 14px; }
.weeklybox { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 8px 12px; }

/* cook mode */
.mlink { border: 0; background: none; color: var(--leaf); font-weight: 600; font-size: 13px; padding: 4px 0 0; }
.cook h3 { margin: 16px 0 6px; }
.cook ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
.cook ol li { counter-increment: s; display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 17px; line-height: 1.45; cursor: pointer; }
.cook ol li::before { content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--leaf-soft); color: var(--leaf); font-size: 14px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.cook ol li.done { color: var(--muted); text-decoration: line-through; }
.cook ol li.done::before { background: var(--leaf); color: var(--leaf-ink); content: "✓"; }
.cook .ci { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.cook .ci span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cook .meta { color: var(--muted); font-size: 13px; }

/* my recipes */
ul.mine { list-style: none; margin: 8px 0 14px; padding: 0; }
ul.mine li { border-top: 1px solid var(--line); padding: 8px 0; }
ul.mine .head { display: flex; align-items: center; gap: 10px; }
ul.mine .rname { flex: 1; min-width: 0; font-weight: 600; }

/* usual shops */
.us { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 10px 12px; margin: 10px 0 8px; }
.us h2 { margin: 0 0 2px; font-size: 17px; }
.us .row { display: flex; gap: 8px; margin: 8px 0; }
.us .row input { flex: 1; min-width: 0; }
.us ul { list-style: none; margin: 0; padding: 0; }
.us li { border-top: 1px solid var(--line); padding: 10px 0; }
.us .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.us .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.us .sum { color: var(--muted); font-size: 13px; margin: 2px 0 4px; }
.us .acts { display: flex; gap: 14px; }

/* more */
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 10px 12px; margin: 0 0 10px; }
.cc li { border-bottom: 1px solid var(--line); padding: 10px 0; }
.cc .head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.cc p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.cc p.free { color: var(--leaf); font-weight: 600; }
.pantry { display: flex; flex-wrap: wrap; gap: 6px; }
.pantry .chip { display: inline-flex; gap: 6px; align-items: center; }

/* bottom nav */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--paper); border-top: 1px solid var(--line);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
nav .in { max-width: 640px; margin: 0 auto; display: flex; }
nav button { flex: 1; border: 0; background: none; color: var(--muted); padding: 6px 0 4px; font-size: 11.5px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 54px; position: relative; }
nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-selected="true"] { color: var(--leaf); font-weight: 700; }
.badge { position: absolute; top: 2px; left: calc(50% + 6px); background: var(--leaf); color: var(--leaf-ink); border-radius: 99px; font-size: 10.5px; min-width: 17px; padding: 0 4px; line-height: 17px; text-align: center; }
.badge:empty { display: none; }

/* sheet */
#sheet { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
#sheet .box { background: var(--paper); width: 100%; max-width: 640px; max-height: 88%; display: flex; flex-direction: column; border-radius: 14px 14px 0 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#sheet .sb { overflow-y: auto; flex: 1; min-height: 0; margin: 10px 0; }
#sheet .pick.planned { opacity: .5; }
#sheet .pick .ptag { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
#sheet .pick { display: flex; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 0; gap: 8px; justify-content: space-between; align-items: center; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 8px 16px; font-size: 13.5px; z-index: 50; max-width: 90%; }
.sync { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .prog i { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow"><h1>Meal Cart</h1><span class="sync" id="sync" role="status"></span></div>
    <div id="hextra"></div>
  </header>
  <main id="main"></main>
</div>
<nav aria-label="Sections"><div class="in" id="nav"></div></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
const RECIPES = [{"id":"cheesy-tomato-pasta","name":"Cheesy tomato pasta","tier":"easy","mins":20,"servings":2,"ingredients":[{"name":"penne pasta","query":"penne pasta 500g","qty":150,"unit":"g","pack":500},{"name":"passata","query":"passata 500g","qty":250,"unit":"g","pack":500},{"name":"mozzarella","query":"mozzarella ball","qty":1,"unit":"pack","pack":1},{"name":"garlic","query":"garlic bulb","qty":1,"unit":"bulb","pack":1}],"meal":"dinner","method":["Boil the penne in salted water until just tender, about 10 minutes.","Meanwhile, soften crushed garlic in a little oil in a pan for 1 minute, then add the passata and simmer for 8 minutes. Season.","Drain the pasta and stir it into the sauce.","Tear the mozzarella over the top and stir until it melts. Serve straight away."]},{"id":"chicken-fajitas","name":"Chicken fajita wraps","tier":"easy","mins":25,"servings":4,"ingredients":[{"name":"chicken breast","query":"chicken breast fillets","qty":500,"unit":"g","pack":650},{"name":"fajita seasoning","query":"fajita seasoning mix","qty":1,"unit":"sachet","pack":1},{"name":"peppers","query":"mixed peppers 3 pack","qty":1,"unit":"pack","pack":1},{"name":"tortilla wraps","query":"tortilla wraps 8 pack","qty":8,"unit":"wraps","pack":8},{"name":"soured cream","query":"soured cream","qty":1,"unit":"pot","pack":1}],"meal":"dinner","method":["Slice the chicken and the peppers into strips.","Fry the chicken in a hot oiled pan for 6 to 7 minutes until golden and cooked through. Stir in the fajita seasoning for the last minute.","Add the peppers and cook for 4 minutes until softened.","Warm the wraps in a dry pan or the microwave.","Fill the wraps with the chicken mix and top with soured cream."]},{"id":"chilli-con-carne","name":"Chilli con carne","tier":"medium","mins":60,"servings":4,"ingredients":[{"name":"beef mince","query":"beef mince 500g","qty":500,"unit":"g","pack":500},{"name":"onions","query":"brown onions","qty":2,"unit":"onions","pack":3},{"name":"chopped tomatoes","query":"chopped tomatoes 400g","qty":2,"unit":"tins","pack":1},{"name":"kidney beans","query":"red kidney beans tin","qty":1,"unit":"tin","pack":1},{"name":"chilli seasoning","query":"chilli con carne seasoning","qty":1,"unit":"sachet","pack":1},{"name":"long grain rice","query":"long grain rice 1kg","qty":300,"unit":"g","pack":1000}],"meal":"dinner","method":["Soften the chopped onions in oil for 5 minutes.","Add the mince and brown it, breaking up the lumps, for 6 to 8 minutes.","Stir in the chilli seasoning, chopped tomatoes and drained kidney beans. Simmer gently for 30 to 40 minutes, stirring now and then, until thick.","Cook the rice following the packet.","Season the chilli to taste and serve over the rice."]},{"id":"chicken-tikka-masala","name":"Chicken tikka masala","tier":"medium","mins":55,"servings":4,"ingredients":[{"name":"chicken thighs","query":"chicken thigh fillets","qty":600,"unit":"g","pack":600},{"name":"tikka paste","query":"tikka masala curry paste","qty":1,"unit":"jar","pack":1},{"name":"natural yoghurt","query":"natural yoghurt 500g","qty":150,"unit":"g","pack":500},{"name":"coconut milk","query":"coconut milk tin","qty":1,"unit":"tin","pack":1},{"name":"basmati rice","query":"basmati rice 1kg","qty":300,"unit":"g","pack":1000},{"name":"naan bread","query":"naan bread 4 pack","qty":4,"unit":"naan","pack":4}],"meal":"dinner","method":["Cut the chicken thighs into chunks and coat with half the yoghurt and a spoon of the tikka paste. Leave for 10 minutes or longer.","Fry the chicken in a hot pan until browned all over, about 6 minutes.","Add the rest of the tikka paste and cook for 1 minute, then pour in the coconut milk. Simmer for 20 to 25 minutes until the chicken is tender and the sauce is thick.","Cook the basmati rice following the packet and warm the naan.","Stir the remaining yoghurt through the curry and serve with the rice and naan."]},{"id":"mushroom-risotto","name":"Wild mushroom risotto","tier":"hard","mins":50,"servings":2,"ingredients":[{"name":"arborio rice","query":"arborio risotto rice","qty":200,"unit":"g","pack":500},{"name":"mixed mushrooms","query":"mixed wild mushrooms","qty":250,"unit":"g","pack":250},{"name":"white wine","query":"dry white wine 75cl","qty":1,"unit":"bottle","pack":1},{"name":"parmesan","query":"parmesan block","qty":1,"unit":"pack","pack":1},{"name":"vegetable stock","query":"vegetable stock cubes","qty":1,"unit":"pack","pack":1},{"name":"shallots","query":"shallots","qty":1,"unit":"pack","pack":1}],"meal":"dinner","method":["Warm the vegetable stock in a pan and keep it hot. Finely chop the shallots.","Fry the mushrooms in oil over a high heat until golden, then set aside.","Soften the shallots in a little butter or oil for 3 minutes. Add the arborio rice and stir for 1 minute.","Pour in a splash of white wine and let it cook away. Add the stock a ladleful at a time, stirring, until the rice is creamy and tender, about 20 minutes.","Stir in the mushrooms and plenty of grated parmesan. Rest for 2 minutes and serve."]},{"id":"beef-wellington","name":"Classic Beef Wellington","tier":"hard","mins":150,"servings":4,"ingredients":[{"name":"beef fillet","query":"beef fillet joint","qty":1,"unit":"joint","pack":1},{"name":"puff pastry","query":"ready rolled puff pastry","qty":1,"unit":"sheet","pack":1},{"name":"chestnut mushrooms","query":"chestnut mushrooms 400g","qty":400,"unit":"g","pack":400},{"name":"parma ham","query":"parma ham","qty":1,"unit":"pack","pack":1},{"name":"english mustard","query":"english mustard","qty":1,"unit":"jar","pack":1},{"name":"eggs","query":"free range eggs 6 pack","qty":1,"unit":"egg","pack":6}],"meal":"dinner","method":["Season the beef fillet and sear it in a very hot pan until browned on every side. Brush with English mustard and cool.","Blitz the chestnut mushrooms to a rough paste and cook in a dry pan until all the moisture has gone. Cool completely.","Lay out overlapping slices of parma ham on cling film, spread over the mushroom mixture, place the beef on top and roll up tightly. Chill for 30 minutes.","Unroll the beef onto the puff pastry, wrap it and seal the edges. Brush all over with beaten egg and chill for 15 minutes.","Bake at 200\u00b0C (180\u00b0C fan) for 35 to 40 minutes for medium-rare, until golden. Rest for 10 minutes before slicing."]},{"id":"easy-teriyaki-chicken","name":"Easy Teriyaki Chicken","tier":"easy","mins":25,"servings":4,"ingredients":[{"name":"chicken thigh fillets","query":"boneless chicken thigh fillets","qty":600,"unit":"g","pack":650},{"name":"teriyaki sauce","query":"teriyaki sauce","qty":1,"unit":"pack","pack":1},{"name":"jasmine rice","query":"jasmine rice 1kg","qty":300,"unit":"g","pack":1000},{"name":"tenderstem broccoli","query":"tenderstem broccoli 200g","qty":200,"unit":"g","pack":200},{"name":"spring onions","query":"spring onions","qty":1,"unit":"pack","pack":1}],"meal":"dinner","method":["Cook the jasmine rice following the packet.","Fry the chicken thigh fillets in a hot oiled pan for 5 minutes each side until golden and cooked through.","Add the teriyaki sauce and let it bubble until sticky and glossy, about 2 minutes.","Steam or boil the tenderstem broccoli for 3 to 4 minutes.","Serve the chicken on rice with the broccoli and sliced spring onions."]},{"id":"sheet-pan-gnocchi","name":"Sheet Pan Gnocchi","tier":"easy","mins":30,"servings":4,"ingredients":[{"name":"gnocchi","query":"potato gnocchi 500g","qty":500,"unit":"g","pack":500},{"name":"cherry tomatoes","query":"cherry tomatoes 250g","qty":250,"unit":"g","pack":250},{"name":"courgettes","query":"courgettes","qty":2,"unit":"each","pack":2},{"name":"red onion","query":"red onions","qty":1,"unit":"each","pack":3},{"name":"mozzarella","query":"mozzarella ball","qty":1,"unit":"pack","pack":1}],"meal":"dinner","method":["Heat the oven to 220\u00b0C (200\u00b0C fan).","Tip the gnocchi, halved cherry tomatoes, chopped courgettes and sliced red onion onto a large tray. Toss with oil, salt and pepper.","R /*
 * Dietary tags worked out from ingredient names (so your own recipes get tagged too).
 * A guide only: it can't see inside packaged products, so always check labels.
 * Conservative: when an ingredient is commonly NOT suitable (e.g. parmesan, soy sauce) it counts against the tag.
 */
const Diet = (() => {
  const re = (words) => new RegExp("\\b(" + words.join("|") + ")", "i");

  const MEAT = re(["chicken", "beef", "lamb", "pork", "bacon", "ham\\b", "ham hock", "gammon", "sausage", "chorizo", "pepperoni", "mince\\b",
    "steak", "duck", "turkey", "pancetta", "lardons", "prosciutto", "parma", "brisket", "ribs", "burger", "liver", "meatball", "venison", "veal",
    "bouillon", "gelatin"]);
  const FISH = re(["fish", "cod\\b", "haddock", "salmon", "tuna", "prawn", "shrimp", "mussel", "crab", "scallop", "seafood", "anchov", "squid",
    "worcestershire", "caesar", "pad thai sauce", "green curry paste", "red curry paste", "massaman", "oyster"]);
  const NOT_VEG_CHEESE = re(["parmesan", "gruyere", "pesto"]);      // traditionally made with animal rennet
  const EGG = re(["egg", "mayo", "hollandaise", "brioche", "tagliatelle", "pappardelle", "marie rose", "egg noodle", "ramen", "yolk"]);
  const DAIRY = re(["milk", "cheese", "cheddar", "mozzarella", "parmesan", "feta", "halloumi", "gruyere", "ricotta", "mascarpone", "cream",
    "butter", "buttermilk", "yoghurt", "yogurt", "tzatziki", "hollandaise", "pesto", "caesar", "white sauce", "brioche", "naan", "croissant",
    "gravy granules", "custard"]);
  const NOT_DAIRY = re(["coconut milk", "coconut cream", "(oat|almond|soy|soya|rice) milk", "peanut butter", "almond butter", "nut butter", "butter beans?", "butternut", "cocoa butter", "dairy.?free"]);
  const HONEY = re(["honey"]);
  const GLUTEN = re(["penne", "fusilli", "rigatoni", "spaghetti", "linguine", "tagliatelle", "macaroni", "pappardelle", "lasagne", "pasta",
    "noodle", "ramen", "flour", "bread", "loaf", "baguette", "bun\\b", "buns\\b", "rolls?\\b", "wrap", "tortilla", "naan", "pitta", "flatbread",
    "muffin", "brioche", "sourdough", "croissant", "crusty", "sponge finger", "panko", "breadcrumb", "pastry", "gnocchi", "couscous", "oats",
    "cereal", "soy sauce", "teriyaki", "katsu", "gravy granules", "worcestershire", "sausage", "dumpling", "fish cake", "biscuit"]);
  const GLUTEN_FREE_EXCEPTIONS = re(["rice noodle", "rice flour", "gluten.?free"]);

  // "has this ingredient" tags for the extra filters (stock cubes, gravy etc. don't count as the meat itself)
  const NOT_THE_MEAT = re(["stock", "bouillon", "cube", "gravy", "seasoning", "flavou?r"]);
  const HAS = {
    chicken: re(["chicken", "poultry"]),
    beef: re(["beef", "steak", "brisket", "burger", "mince\\b.*beef", "beef.*mince"]),
    pork: re(["pork", "bacon", "ham\\b", "gammon", "sausage", "chorizo", "pancetta", "lardons", "prosciutto", "pepperoni", "ribs"]),
    lamb: re(["lamb"]),
    seafood: re(["fish", "cod\\b", "haddock", "salmon", "tuna", "prawn", "shrimp", "mussel", "crab", "scallop", "seafood", "squid", "anchov", "mackerel", "trout", "sardine"]),
    pasta: re(["penne", "fusilli", "rigatoni", "spaghetti", "linguine", "tagliatelle", "macaroni", "pappardelle", "lasagne", "pasta", "orzo", "gnocchi"]),
    rice: re(["rice\\b"]),
    potato: re(["potato", "potatoes", "jacket", "chips\\b", "fries"]),
    eggs: re(["\\beggs?\\b"]),
  };
  const NOT_RICE = re(["rice noodle", "rice flour", "rice vinegar", "rice wine", "rice paper"]);

  const text = (r) => r.ingredients.map((i) => `${i.name} ${i.query || ""}`).join(" | ").toLowerCase();

  function classify(r) {
    // test ingredient by ingredient so one ingredient's words can't mix with another's
    const has = {}; for (const k in HAS) has[k] = false;
    let meat = false, fish = false, rennet = false, egg = false, dairy = false, honey = false, gluten = false;
    for (const i of r.ingredients) {
      const t = `${i.name} ${i.query || ""}`.toLowerCase();
      for (const k in HAS) if (!has[k] && HAS[k].test(t) && !(["chicken", "beef", "pork", "lamb", "seafood"].includes(k) && NOT_THE_MEAT.test(t)) && !(k === "rice" && NOT_RICE.test(t))) has[k] = true;
      if (MEAT.test(t)) meat = true;
      if (FISH.test(t)) fish = true;
      if (NOT_VEG_CHEESE.test(t)) rennet = true;
      if (EGG.test(t)) egg = true;
      if (DAIRY.test(t) && !NOT_DAIRY.test(t)) dairy = true;
      if (HONEY.test(t)) honey = true;
      if (GLUTEN.test(t) && !GLUTEN_FREE_EXCEPTIONS.test(t)) gluten = true;
    }
    const vegetarian = !meat && !fish && !rennet;
    return {
      vegetarian,
      vegan: vegetarian && !egg && !dairy && !honey,
      glutenFree: !gluten,
      dairyFree: !dairy,
      quick: r.mins > 0 && r.mins <= 30,
      veryQuick: r.mins > 0 && r.mins <= 15,
      ...has,
    };
  }

  const cache = new WeakMap();
  function tags(r) {
    let c = cache.get(r.ingredients);
    if (!c || c.mins !== r.mins) { c = { ...classify(r), mins: r.mins }; cache.set(r.ingredients, c); }
    if (Array.isArray(r.tags) && r.tags.length) {            // tags ticked by hand on your own recipes add to the detected ones
      const m = { ...c }; for (const k of r.tags) m[k] = true; if (m.vegan) m.vegetarian = true; return m;
    }
    return c;
  }

  return { classify, tags, text };
})();

    main.append(el("h3", null, "Not buying (you have it)"));
    const ul = el("ul");
    have.forEach((it) => { const li = el("li", "item"); li.append(el("span", "nm", it.name)); const b = el("button", "link", "Put back"); b.type = "button";
      b.addEventListener("click", () => { skipped.delete(it.key); persist(); rr(); }); li.append(b); ul.append(li); });
    main.append(ul);
  }
  if (items.length) {
    const row = el("div", "hrow"); row.style.cssText = "margin-top:18px;flex-wrap:wrap";
    const cp = el("button", "btn small", "Copy list"); cp.type = "button";
    cp.addEventListener("click", async () => {
      const lines = []; for (const a of AISLE_ORDER) { const g = groups.get(a); if (!g) continue; lines.push(a.toUpperCase()); g.forEach((i) => lines.push((ticked.has(i.key) ? "[x] " : "[ ] ") + i.name + " × " + i.count)); lines.push(""); }
      try { await navigator.clipboard.writeText(lines.join("\n")); toast("List copied"); } catch (_) { toast("Couldn’t copy on this device"); }
    });
    const rt = el("button", "btn small", "Untick all"); rt.type = "button"; rt.addEventListener("click", () => { ticked.clear(); persist(); rr(); });
    const fin = el("button", "btn small", "Finished shopping"); fin.type = "button";
    fin.addEventListener("click", () => {
      if (!fin.dataset.sure) { fin.dataset.sure = 1; fin.textContent = "Tap again: clear picks and list"; return; }
      selected.clear(); recipeSkip.clear(); swaps.clear(); skipped.clear(); ticked.clear(); essSel.clear(); pantryBuy.clear(); extra = [];
      persist(); render(); toast("List cleared. Your plan and recipes are kept.");
    });
    row.append(cp, rt, fin); main.append(row);
  }
}
function itemLi(it) {
  const li = el("li", "item"); const d = ticked.has(it.key); li.classList.toggle("done", d);
  const lab = el("label"); const cb = el("input"); cb.type = "checkbox"; cb.checked = d; cb.setAttribute("aria-label", it.name);
  const nm = el("span", "nm", it.name);
  const detail = it.extra || it.ess ? "" : (it.unit === "g" || it.unit === "ml" ? "uses " + Math.round(it.need) + " " + it.unit : "") + (it.from.length ? (it.unit === "g" || it.unit === "ml" ? " · " : "") + it.from.slice(0, 2).join(", ") + (it.from.length > 2 ? " +" + (it.from.length - 2) : "") : "");
  if (detail) nm.append(el("small", null, detail));
  lab.append(cb, nm);
  cb.addEventListener("change", () => { cb.checked ? ticked.add(it.key) : ticked.delete(it.key); persist(); rr(); });
  li.append(lab);
  if (it.count > 1) li.append(el("span", "ct", "× " + it.count));
  const x = el("button", "x", it.extra ? "Remove" : "Have it"); x.type = "button"; x.setAttribute("aria-label", (it.extra ? "Remove " : "I already have ") + it.name);
  x.addEventListener("click", () => { if (it.extra) extra = extra.filter((e) => "x:" + e.id !== it.key); else skipped.add(it.key); ticked.delete(it.key); persist(); rr(); });
  li.append(x);
  return li;
}

// ---------- Extras (essentials) ----------
let weeklyOpen = false;
function viewEss(main) {
  main.append(el("p", "hint", "Everyday things you buy most weeks. Tick what you need and it joins your shopping list. Add a brand or type under any ticked item."));
  const list = essList();
  const wk = list.filter((e) => weekly.has(e.id));
  const box = el("div", "weeklybox");
  const hd = el("div", "hrow"); hd.append(el("strong", null, "Your weekly list" + (wk.length ? " (" + wk.length + ")" : "")));
  hd.firstChild.style.flex = "1";
  const tb = el("button", "btn small", wk.length ? "Tick them all" : "Empty"); tb.type = "button"; tb.disabled = !wk.length;
  tb.addEventListener("click", () => { wk.forEach((e) => essSel.set(e.id, weekly.get(e.id) || 1)); persist(); rr(); toast("Weekly list ticked"); });
  hd.append(tb); box.append(hd);
  box.append(el("p", "hint", wk.length ? wk.map((e) => e.name).join(", ") : "Tap the star on an item below to build a list you can tick in one go."));
  main.append(box);
  const cats = [...new Set(list.map((e) => e.cat))];
  for (const c of cats) {
    main.append(el("h3", null, c));
    for (const e of list.filter((x) => x.cat === c)) {
      const row = el("div", "crow"); const on = essSel.has(e.id);
      const cb = el("input"); cb.type = "checkbox"; cb.checked = on; cb.setAttribute("aria-label", e.name);
      const g = el("div", "grow"); g.append(el("div", null, e.name));
      if (on) {
        const n = el("input"); n.type = "text"; n.value = essNotes[e.id] || ""; n.placeholder = e.ph || "Brand or type (optional)"; n.setAttribute("aria-label", "Brand or type for " + e.name);
        n.addEventListener("input", () => { essNotes[e.id] = n.value; persist(); }); g.append(n);
      }
      cb.addEventListener("change", () => { cb.checked ? essSel.set(e.id, weekly.get(e.id) || 1) : essSel.delete(e.id); persist(); rr(); });
      row.append(cb, g);
      if (on) {
        const st = el("div", "stepper"); const dn = el("button", null, "−"), up = el("button", null, "+"); dn.type = up.type = "button";
        dn.setAttribute("aria-label", "Fewer"); up.setAttribute("aria-label", "More");
        dn.addEventListener("click", () => { essSel.set(e.id, Math.max(1, essSel.get(e.id) - 1)); persist(); rr(); }); up.addEventListener("click", () => { essSel.set(e.id, Math.min(20, essSel.get(e.id) + 1)); persist(); rr(); });
        st.append(dn, el("span", null, String(essSel.get(e.id))), up); row.append(st);
      }
      const star = el("button", "star"); star.type = "button"; star.innerHTML = STAR; star.setAttribute("aria-pressed", String(weekly.has(e.id))); star.setAttribute("aria-label", weekly.has(e.id) ? "Remove from weekly list" : "Add to weekly list");
      star.addEventListener("click", () => { weekly.has(e.id) ? weekly.delete(e.id) : weekly.set(e.id, essSel.get(e.id) || 1); persist(); rr(); });
      row.append(star); main.append(row);
    }
  }
  main.append(el("h3", null, "Add your own item"));
  const ar = el("div", "addrow"); const inp = el("input"); inp.type = "text"; inp.id = "ess-add"; inp.placeholder = "e.g. Cat food"; inp.setAttribute("aria-label", "New extra item");
  const ab = el("button", "btn", "Add"); ab.type = "button";
  ab.addEventListener("click", () => { const v = inp.value.trim(); if (!v) return; const id = "u" + Date.now().toString(36); essCustom.push({ id, name: v, query: v }); essSel.set(id, 1); persist(); rr(); });
  ar.append(inp, ab); main.append(ar);
}

// ---------- More: use up leftovers, pantry, backup ----------
// ---------- My recipes (in More): recipes you wrote, which also appear in the main All list ----------
function myRecipesBlock(main) {
  main.append(el("h2", null, "My recipes"));
  main.append(el("p", "hint", "Add your own meals. They show up in the main meal list alongside the rest, with the same filters."));
  const nw = el("button", "btn primary", "+ New recipe"); nw.type = "button"; nw.id = "new-recipe"; nw.addEventListener("click", () => openEditor(null)); main.append(nw);
  const ul = el("ul", "mine"); ul.id = "mine-list";
  custom.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach((r) => {
    const li = el("li"); const h = el("div", "head"); const nm = el("div", "rname", r.name); nm.append(el("span", "tag", MEAL_LABEL[r.meal] + " · " + TIER_LABEL[r.tier]));
    const ed = el("button", "link", "Edit"); ed.type = "button"; ed.addEventListener("click", () => openEditor(r.id));
    const de = el("button", "link danger", "Delete"); de.type = "button";
    de.addEventListener("click", () => { if (!de.dataset.sure) { de.dataset.sure = 1; de.textContent = "Tap again"; return; }
      custom = custom.filter((x) => x.id !== r.id); selected.delete(r.id); recipeSkip.delete(r.id); favs.delete(r.id); persist(); rr(); });
    h.append(nm, ed, de); li.append(h); ul.append(li);
  });
  if (!custom.length) ul.append(el("li", "hint", "No recipes of your own yet."));
  main.append(ul);
}
function useUpBlock(main) {
  main.append(el("h2", null, "Complete your cart"));
  main.append(el("p", "hint", "Meals that use up what’s left in the packs you’re buying."));
  const { lo, list } = suggestions();
  const seg = el("div", "chips");
  [["all", "Any meal"], ...Object.entries(MEAL_LABEL)].forEach(([v, l]) => { const c = el("button", "chip", l); c.type = "button"; c.setAttribute("aria-pressed", String(ccMeal === v)); c.addEventListener("click", () => { ccMeal = v; rr(); }); seg.append(c); });
  main.append(seg);
  main.append(el("p", "hint", !selected.size ? "Pick some meals first. This shows meals that would use up what’s left in the packs you’re buying."
    : !lo.size ? "Nothing much left over from your picks." : "Left over from your picks: " + [...lo.values()].map((l) => l.name + " (" + (l.unit === "g" || l.unit === "ml" ? Math.round(l.left) + " " + l.unit : fmtNum(l.left) + " left") + ")").join(", ")));
  const ul = el("ul", "cc");
  list.slice(0, 12).forEach(({ r, used, extra: ex, servings }) => {
    const li = el("li"); const h = el("div", "head"); const nm = el("div", "rname", r.name); nm.append(el("span", "tag", MEAL_LABEL[r.meal] + " · " + TIER_LABEL[r.tier]));
    if (servings !== r.servings) nm.append(el("span", "tag", "for " + servings));
    const add = el("button", "btn small", "+ Add"); add.type = "button";
    add.addEventListener("click", () => {
      selected.set(r.id, servings); const sw = used.filter((x) => x.swap);
      if (sw.length) swaps.set(r.id, new Map(sw.map((x) => [ingKey(x.ing), { query: x.l.query, name: x.l.name, pack: x.l.pack, unit: x.l.unit, orig: x.ing.name }])));
      persist(); rr(); toast(r.name + " added to your picks");
    });
    h.append(nm, add); li.append(h);
    li.append(el("p", null, "Uses: " + used.map((x) => x.swap ? x.l.name + " (instead of " + x.ing.name + ")" : x.ing.name).join(", ")));
    li.append(ex.length ? el("p", null, "Still need " + ex.length + ": " + ex.slice(0, 4).map((x) => x.name).join(", ") + (ex.length > 4 ? ", +" + (ex.length - 4) + " more" : "")) : el("p", "free", "Nothing else to buy!"));
    ul.append(li);
  });
  main.append(ul);
  if (lo.size && !list.length) main.append(el("p", "hint", "No other meals fit right now. Try “Any meal”."));

}
function viewMore(main) {
  myRecipesBlock(main);
  main.append(el("h2", null, "Pantry"));
  main.append(el("p", "hint", "Things you always have. They stay off your list (you can still tick them in a recipe to buy anyway)."));
  const pw = el("div", "pantry");
  [...pantry].sort().forEach((n) => { const c = el("button", "chip", n + " ✕"); c.type = "button"; c.setAttribute("aria-label", "Remove " + n + " from pantry"); c.addEventListener("click", () => { pantry.delete(n); pantryBuy.delete(n); persist(); rr(); }); pw.append(c); });
  if (!pantry.size) pw.append(el("span", "hint", "Nothing yet."));
  main.append(pw);
  const sug = new Set(); const HINT = /flour|sugar|soy sauce|^garlic|cumin|paprika|garam|curry powder|tomato puree|vinegar|stock|mustard|nutmeg|cinnamon|chilli flakes|honey|maple|dijon|worcestershire|star anise|yeast|cocoa|vanilla|mirin|sesame|salt|pepper|oil/i;
  all().forEach((r) => r.ingredients.forEach((i) => { const n = pantryName(i); if (HINT.test(n) && !pantry.has(n)) sug.add(n); }));
  if (sug.size) { main.append(el("h3", null, "Tap to add")); const sw = el("div", "pantry"); [...sug].sort().slice(0, 16).forEach((n) => { const c = el("button", "chip", "+ " + n); c.type = "button"; c.addEventListener("click", () => { pantry.add(n); persist(); rr(); }); sw.append(c); }); main.append(sw); }
  const pa = el("div", "addrow"); const pi = el("input"); pi.type = "text"; pi.id = "pantry-add"; pi.placeholder = "Add a pantry item"; pi.setAttribute("aria-label", "Add a pantry item");
  const pb = el("button", "btn", "Add"); pb.type = "button"; pb.addEventListener("click", () => { const v = pi.value.trim().toLowerCase(); if (!v) return; pantry.add(v); persist(); rr(); });
  pa.append(pi, pb); main.append(pa);

  main.append(el("h2", null, "Backup and moving between devices"));
  main.append(el("p", "hint", "Signed in, your plan and lists sync between your devices automatically. You can also copy everything as text and paste it somewhere safe."));
  const bk = el("div", "hrow"); bk.style.flexWrap = "wrap";
  const ex = el("button", "btn small", "Copy backup"); ex.type = "button";
  ex.addEventListener("click", async () => { try { await navigator.clipboard.writeText(JSON.stringify({ app: "meal-cart-planner", data: snapshot() })); toast("Backup copied"); } catch (_) { toast("Couldn’t copy here"); } });
  bk.append(ex); main.append(bk);
  const ta = el("textarea"); ta.id = "restore"; ta.rows = 3; ta.placeholder = "Paste a backup here to restore it"; ta.style.marginTop = "8px"; main.append(ta);
  const rs = el("button", "btn small", "Restore from pasted backup"); rs.type = "button"; rs.style.marginTop = "6px";
  const msg = el("p", "hint"); msg.setAttribute("role", "status");
  rs.addEventListener("click", () => {
    try { const o = JSON.parse(ta.value); if (!o || o.app !== "meal-cart-planner" || typeof o.data !== "object") throw 0;
      if (!rs.dataset.sure) { rs.dataset.sure = 1; rs.textContent = "Tap again to replace everything saved here"; return; }
      hydrate(o.data); persist(); render(); toast("Backup restored"); } catch (_) { msg.textContent = "That doesn’t look like a Meal Cart backup."; }
  });
  main.append(rs, msg);
  const note = el("p", "hint", "Tip: on iPhone or Android, use Share or the browser menu → Add to Home Screen to open this like an app."); main.append(note);
}

  render();
  await loadAll();
  render();
})();
