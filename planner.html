<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c3a">
<title>Meal Cart Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column, phone first. Sticky header, content, bottom tab bar. Same green-on-paper look as the Chrome extension. */
:root {
  --paper: #f6f8f5; --card: #ffffff; --ink: #17261c; --muted: #5d6b61; --line: #d5ddd6;
  --leaf: #1f5c3a; --leaf-ink: #ffffff; --leaf-soft: #e3efe7; --tomato: #c8321f; --star: #d99a12;
  --font: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121a15; --card: #1a251e; --ink: #e8f0ea; --muted: #9bab9f; --line: #2c3a31;
  --leaf: #4fae78; --leaf-ink: #0c1a11; --leaf-soft: #1f3327; --tomato: #ee7a68; --star: #e8b43c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #121a15; --card: #1a251e; --ink: #e8f0ea; --muted: #9bab9f; --line: #2c3a31;
  --leaf: #4fae78; --leaf-ink: #0c1a11; --leaf-soft: #1f3327; --tomato: #ee7a68; --star: #e8b43c; color-scheme: dark; }
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.4 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); padding: 12px 0 8px; border-bottom: 1px solid var(--line); }
.hrow { display: flex; align-items: center; gap: 10px; }
h1 { margin: 0; font-size: 19px; letter-spacing: -0.01em; flex: 1; }
h2 { margin: 18px 0 6px; font-size: 14px; letter-spacing: .02em; }
h3 { margin: 14px 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
main { flex: 1; padding: 8px 0 96px; }
ul { list-style: none; margin: 0; padding: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 14px; min-height: 40px; }
.btn.primary { background: var(--leaf); color: var(--leaf-ink); border-color: var(--leaf); font-weight: 600; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.link { background: none; border: 0; color: var(--leaf); padding: 6px 4px; font-weight: 600; }
.link.muted { color: var(--muted); font-weight: 400; }
.link.danger { color: var(--tomato); }
.hint { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
input[type=text], input[type=number], select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); min-height: 40px; }
input[type=checkbox] { accent-color: var(--leaf); width: 22px; height: 22px; flex: none; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

.seg { display: flex; gap: 4px; margin: 8px 0 0; }
.seg button { flex: 1; padding: 8px 0; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; min-height: 38px; }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg.meal button[aria-selected="true"] { background: var(--leaf); color: var(--leaf-ink); border-color: var(--leaf); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 0; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 11px; font-size: 13px; min-height: 30px; }
.chip[aria-pressed="true"] { background: var(--leaf-soft); color: var(--leaf); border-color: var(--leaf); font-weight: 600; }
.tools { display: flex; gap: 8px; margin: 8px 0 0; }
.tools select { width: auto; flex: none; }

.recipes > li { border-bottom: 1px solid var(--line); padding: 6px 0; }
.rrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.rrow .grow { flex: 1; min-width: 0; }
.rname { font-weight: 600; overflow-wrap: anywhere; }
.rmeta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 2px 8px; }
.dt { color: var(--leaf); }
.star { border: 0; background: none; padding: 6px; color: var(--muted); line-height: 0; }
.star svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.star[aria-pressed="true"] { color: var(--star); }
.star[aria-pressed="true"] svg { fill: currentColor; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.stepper button { border: 0; background: none; width: 34px; height: 34px; font-size: 18px; }
.stepper span { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.on > .rrow .rname { color: var(--leaf); }
.rextra { padding: 0 0 8px 32px; }
.rextra .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 2px 0 6px; }
.rextra select { width: auto; min-height: 34px; padding: 4px 8px; }
.ings li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ings li.off .iname { text-decoration: line-through; color: var(--muted); }
.ings .iname { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ings .iqty { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--muted); margin-left: 6px; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }

/* shop */
.prog { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
.prog i { display: block; height: 100%; background: var(--leaf); width: 0; transition: width .2s; }
.shop-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.aisle { margin-top: 14px; }
.aisle h3 { margin: 0 0 2px; display: flex; justify-content: space-between; }
.item { display: flex; align-items: center; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); min-height: 54px; }
.item label { flex: 1; display: flex; align-items: center; gap: 12px; min-height: 54px; cursor: pointer; min-width: 0; }
.item .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item .nm small { display: block; color: var(--muted); font-size: 12.5px; }
.item .ct { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.item.done .nm { text-decoration: line-through; color: var(--muted); }
.item.done .nm small { text-decoration: none; }
.item .x { border: 0; background: none; color: var(--muted); padding: 10px; font-size: 13px; }
.addrow { display: flex; gap: 8px; margin: 10px 0 0; }
.addrow button { flex: none; }

/* planner */
.pl-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 8px; }
.pl-head h2 { margin: 0; }
.pl-head button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; width: 40px; height: 40px; font-size: 20px; }
.day { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 8px 12px; margin: 0 0 8px; }
.day.today { border-color: var(--leaf); box-shadow: inset 3px 0 0 var(--leaf); }
.day h4 { margin: 0 0 2px; display: flex; justify-content: space-between; font-size: 14px; }
.day h4 small { font-weight: 400; color: var(--muted); }
.day li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.day li .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.day .add { width: 100%; text-align: left; border: 1px dashed var(--line); background: none; border-radius: 8px; padding: 8px 10px; color: var(--muted); min-height: 38px; margin-top: 4px; }

/* essentials / lists */
.crow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.crow .grow { flex: 1; min-width: 0; }
.crow input[type=text] { margin-top: 4px; min-height: 34px; padding: 5px 8px; font-size: 14px; }
.weeklybox { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 8px 12px; }

/* more */
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 10px 12px; margin: 0 0 10px; }
.cc li { border-bottom: 1px solid var(--line); padding: 10px 0; }
.cc .head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.cc p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.cc p.free { color: var(--leaf); font-weight: 600; }
.pantry { display: flex; flex-wrap: wrap; gap: 6px; }
.pantry .chip { display: inline-flex; gap: 6px; align-items: center; }

/* bottom nav */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--paper); border-top: 1px solid var(--line);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
nav .in { max-width: 640px; margin: 0 auto; display: flex; }
nav button { flex: 1; border: 0; background: none; color: var(--muted); padding: 6px 0 4px; font-size: 11.5px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 54px; position: relative; }
nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-selected="true"] { color: var(--leaf); font-weight: 700; }
.badge { position: absolute; top: 2px; left: calc(50% + 6px); background: var(--leaf); color: var(--leaf-ink); border-radius: 99px; font-size: 10.5px; min-width: 17px; padding: 0 4px; line-height: 17px; text-align: center; }
.badge:empty { display: none; }

/* sheet */
#sheet { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
#sheet .box { background: var(--paper); width: 100%; max-width: 640px; max-height: 88%; display: flex; flex-direction: column; border-radius: 14px 14px 0 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#sheet .sb { overflow-y: auto; flex: 1; min-height: 0; margin: 10px 0; }
#sheet .pick { display: flex; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 0; gap: 8px; justify-content: space-between; align-items: center; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 8px 16px; font-size: 13.5px; z-index: 50; max-width: 90%; }
.sync { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .prog i { transition: none; } }
</style>
</head>

  <header>

</div>
<nav aria-label="Sections"><div class="in" id="nav"></div></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

function ingList(r, li) {

    const off = pItem ? !pantryBuy.has(pn) : skip.has(ingKey(ing));
    const row = el("li"); row.classList.toggle("off", off);
    const cb = el("input"); cb.type = "checkbox"; cb.checked = !off; cb.setAttribute("aria-label", ing.name);
    cb.addEventListener("change", () => {
      if (pItem) { cb.checked ? pantryBuy.add(pn) : pantryBuy.delete(pn); }
      else { let s = recipeSkip.get(r.id); if (!s) recipeSkip.set(r.id, (s = new Set())); cb.checked ? s.delete(ingKey(ing)) : s.add(ingKey(ing)); if (!s.size) recipeSkip.delete(r.id); }
      row.classList.toggle("off", !cb.checked); persist(); renderNav();
    });
    const sw = swapOf(r.id, ing);
    const nm = el("span", "iname", sw ? sw.name : ing.name);
    if (sw) { nm.append(el("span", "tag", "instead of " + ing.name));
      const u = el("button", "link", "undo"); u.type = "button"; u.addEventListener("click", () => { const m = swaps.get(r.id); m.delete(ingKey(ing)); if (!m.size) swaps.delete(r.id); persist(); li.replaceWith(recipeLi(r)); renderNav(); }); nm.append(u); }
    if (pItem) nm.append(el("span", "tag", "pantry"));
    row.append(cb, nm, el("span", "iqty", fmtQty(ing, scale))); ul.append(row);

  if (r.tier === "custom") {

    ed.addEventListener("click", () => openEditor(r.id));
    de.addEventListener("click", () => { if (de.dataset.sure) { custom = custom.filter((x) => x.id !== r.id); selected.delete(r.id); recipeSkip.delete(r.id); favs.delete(r.id); persist(); render(); } else { de.dataset.sure = 1; de.textContent = "Tap again to delete"; } });
    li2.append(ed, de); ul.append(li2);

}

// ---------- sheet + editor ----------
function openSheet(title, build) {
  const s = $("sheet"); s.innerHTML = ""; s.hidden = false;
  const box = el("div", "box"); box.setAttribute("role", "dialog"); box.setAttribute("aria-label", title);
  const top = el("div", "hrow"); top.append(el("h1", null, title));
  const x = el("button", "link", "Close"); x.type = "button"; x.addEventListener("click", closeSheet); top.append(x);
  const sb = el("div", "sb"); box.append(top, sb); s.append(box); build(sb, box);
  s.onclick = (e) => { if (e.target === s) closeSheet(); };
}
function closeSheet() { const s = $("sheet"); s.hidden = true; s.innerHTML = ""; }
function openPicker(onPick) {
  openSheet("Add a meal", (sb) => {
    const q = el("input"); q.type = "text"; q.placeholder = "Search meals"; q.setAttribute("aria-label", "Search meals"); sb.append(q);
    const list = el("div"); sb.append(list);
    const draw = () => { list.innerHTML = ""; const t = q.value.trim().toLowerCase();
      all().filter((r) => !t || r.name.toLowerCase().includes(t)).sort((a, b) => a.name.localeCompare(b.name)).slice(0, 60).forEach((r) => {
        const b = el("button", "pick"); b.type = "button"; b.append(el("span", null, r.name), el("span", "rmeta", MEAL_LABEL[r.meal] + " · " + TIER_LABEL[r.tier]));
        b.addEventListener("click", () => { onPick(r); closeSheet(); }); list.append(b); }); };
    q.addEventListener("input", draw); draw();
  });
}
function parseIngredients(text) {
  const out = [];
  for (const line of text.split("\n").map((l) => l.trim()).filter(Boolean)) {
    const m = line.match(/^(\d+(?:\.\d+)?)\s*(kg|g|ml|l|x|each|tins?|packs?)?\s+(.+)$/i);
    let qty = 1, unit = "each", name = line;
    if (m) { qty = parseFloat(m[1]); let u = (m[2] || "").toLowerCase(); name = m[3];
      if (u === "kg") { qty *= 1000; u = "g"; } if (u === "l") { qty *= 1000; u = "ml"; }
      unit = u === "g" || u === "ml" ? u : u.startsWith("pack") ? "pack" : "each"; }
    out.push({ name, query: name, qty, unit, pack: unit === "g" || unit === "ml" ? Math.max(500, qty) : 1 });
  }
  return out;
}
function openEditor(id) {
  const r = id ? custom.find((x) => x.id === id) : null;
  openSheet(r ? "Edit recipe" : "New recipe", (sb, box) => {
    const f = (label, node) => { const l = el("label"); l.style.display = "block"; l.style.margin = "0 0 10px"; l.append(el("div", "hint", label), node); sb.append(l); return node; };
    const name = f("Name", Object.assign(el("input"), { type: "text", id: "ed-name", value: r ? r.name : "" }));
    const meal = f("Meal", el("select")); meal.id = "ed-meal"; Object.entries(MEAL_LABEL).forEach(([v, l]) => { const o = new Option(l, v); o.selected = (r ? r.meal : ui.meal) === v; meal.append(o); });
    const sv = f("Serves", Object.assign(el("input"), { type: "number", id: "ed-serves", min: 1, max: 24, value: r ? r.servings : 4 }));
    const mins = f("Minutes (optional)", Object.assign(el("input"), { type: "number", id: "ed-mins", min: 0, max: 600, value: r ? r.mins || "" : "" }));
    const ta = f("Ingredients, one per line, e.g. “300 g penne”, “2 tins chopped tomatoes”, “garlic”", el("textarea")); ta.id = "ed-ings"; ta.rows = 7;
    ta.value = r ? r.ingredients.map((i) => (i.unit === "each" || i.unit === "pack" ? (i.qty === 1 ? "" : i.qty + " ") : i.qty + " " + i.unit + " ") + i.name).join("\n") : "";
    const msg = el("p", "hint"); msg.setAttribute("role", "alert");
    const save = el("button", "btn primary", "Save recipe"); save.type = "button"; save.id = "ed-save"; save.style.width = "100%";
    save.addEventListener("click", () => {
      const ings = parseIngredients(ta.value);
      if (!name.value.trim()) { msg.textContent = "Give the recipe a name."; return; }
      if (!ings.length) { msg.textContent = "Add at least one ingredient."; return; }
      const data = { name: name.value.trim(), meal: meal.value, servings: Math.max(1, Number(sv.value) || 4), mins: Number(mins.value) || 0, ingredients: ings };
      if (r) { Object.assign(r, data); recipeSkip.delete(r.id); if (selected.has(r.id)) selected.set(r.id, data.servings); }
      else { const nr = { id: "c" + Date.now().toString(36), tier: "custom", ...data }; custom.push(nr); ui.meal = nr.meal; ui.tier = "custom"; }
      persist(); closeSheet(); render(); toast("Recipe saved");
    });
    sb.append(msg, save);
  });
}

// ---------- Week ----------
function viewWeek(main) {
  if (!planWeek) planWeek = weekStart(Date.now());
  const thisWeek = weekStart(Date.now());
  const head = el("div", "pl-head");
  const pv = el("button", null, "‹"), nx = el("button", null, "›"); pv.type = nx.type = "button"; pv.setAttribute("aria-label", "Previous week"); nx.setAttribute("aria-label", "Next week");
  pv.addEventListener("click", () => { planWeek = shiftWeek(planWeek, -1); rr(); }); nx.addEventListener("click", () => { planWeek = shiftWeek(planWeek, 1); rr(); });
  head.append(pv, el("h2", null, planWeek === thisWeek ? "This week · from " + fmtDay(planWeek) : planWeek === shiftWeek(thisWeek, 1) ? "Next week · from " + fmtDay(planWeek) : "Week of " + fmtDay(planWeek)), nx);
  main.append(head);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  for (let d = 0; d < 7; d++) {
    const date = new Date(planWeek); date.setDate(date.getDate() + d);
    const box = el("div", "day"); box.classList.toggle("today", date.getTime() === today.getTime());
    const h = el("h4", null, DAYS[d]); h.append(el("small", null, date.toLocaleDateString("en-GB", { day: "numeric", month: "short" })));
    const ul = el("ul");
    dayList(planWeek, d).forEach((e, idx) => {
      const r = byId(e.id); if (!r) return;
      const li = el("li"); li.append(el("span", "nm", r.name));
      const st = el("div", "stepper"); const dn = el("button", null, "−"), up = el("button", null, "+"); dn.type = up.type = "button";
      dn.setAttribute("aria-label", "Fewer servings"); up.setAttribute("aria-label", "More servings");
      dn.addEventListener("click", () => { e.servings = Math.max(1, e.servings - 1); persist(); rr(); }); up.addEventListener("click", () => { e.servings = Math.min(24, e.servings + 1); persist(); rr(); });
      st.append(dn, el("span", null, String(e.servings)), up);
      const x = el("button", "link muted", "✕"); x.type = "button"; x.setAttribute("aria-label", "Remove " + r.name);
      x.addEventListener("click", () => { dayList(planWeek, d).splice(idx, 1); persist(); rr(); });
      li.append(st, x); ul.append(li);
    });
    const add = el("button", "add", "+ Add a meal"); add.type = "button";
    add.addEventListener("click", () => openPicker((r) => { dayList(planWeek, d, true).push({ id: r.id, servings: r.servings }); persist(); rr(); }));
    box.append(h, ul, add); main.append(box);
  }
  const n = planCount(planWeek);
  const act = el("div", "hrow"); act.style.marginTop = "8px";
  const pick = el("button", "btn primary", "Pick all planned meals"); pick.type = "button"; pick.disabled = !n; pick.id = "pl-pick";
  pick.addEventListener("click", () => {
    const tot = new Map();
    for (let d = 0; d < 7; d++) for (const e of dayList(planWeek, d)) if (byId(e.id)) tot.set(e.id, (tot.get(e.id) || 0) + e.servings);
    for (const [id, v] of tot) { selected.set(id, Math.min(v, 24)); expanded.delete(id); }
    ui.tab = "shop"; persist(); render(); window.scrollTo(0, 0); toast("Picked " + tot.size + " planned meal" + (tot.size === 1 ? "" : "s") + ". Servings are added up if a meal repeats.");
  });
  const clr = el("button", "link danger", "Clear week"); clr.type = "button"; clr.hidden = !n;
  clr.addEventListener("click", () => { if (clr.dataset.sure) { delete plans[String(planWeek)]; persist(); rr(); } else { clr.dataset.sure = 1; clr.textContent = "Tap again to clear"; } });
  act.append(pick, clr); main.append(act);
  main.append(el("p", "hint", "“Pick all planned meals” puts them on your shopping list. Meals on the plan stay here until you clear the week."));
}

function viewShop(main, hx) {
  const items = buildItems();
  const buying = items.filter((i) => !skipped.has(i.key));
  const have = items.filter((i) => skipped.has(i.key));
  const done = buying.filter((i) => ticked.has(i.key)).length;
  hx.hidden = false;
  const top = el("div", "shop-top");
  top.append(el("div", "hint", buying.length ? done + " of " + buying.length + " in the trolley" : "Nothing on the list yet"));
  const hide = el("button", "chip", "Hide ticked"); hide.type = "button"; hide.setAttribute("aria-pressed", String(!!ui.hideTicked));
  hide.addEventListener("click", () => { ui.hideTicked = !ui.hideTicked; persist(); rr(); }); top.append(hide);

  ab.addEventListener("click", go); inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); }); add.append(inp, ab); main.append(add);

  if (have.length) {
    main.append(el("h3", null, "Not buying (you have it)"));
    const ul = el("ul");
    have.forEach((it) => { const li = el("li", "item"); li.append(el("span", "nm", it.name)); const b = el("button", "link", "Put back"); b.type = "button";
      b.addEventListener("click", () => { skipped.delete(it.key); persist(); rr(); }); li.append(b); ul.append(li); });
    main.append(ul);
  }
  if (items.length) {
    const row = el("div", "hrow"); row.style.cssText = "margin-top:18px;flex-wrap:wrap";
    const cp = el("button", "btn small", "Copy list"); cp.type = "button";
    cp.addEventListener("click", async () => {
      const lines = []; for (const a of AISLE_ORDER) { const g = groups.get(a); if (!g) continue; lines.push(a.toUpperCase()); g.forEach((i) => lines.push((ticked.has(i.key) ? "[x] " : "[ ] ") + i.name + " × " + i.count)); lines.push(""); }

    });

    const fin = el("button", "btn small", "Finished shopping"); fin.type = "button";
    fin.addEventListener("click", () => {
      if (!fin.dataset.sure) { fin.dataset.sure = 1; fin.textContent = "Tap again: clear picks and list"; return; }
      selected.clear(); recipeSkip.clear(); swaps.clear(); skipped.clear(); ticked.clear(); essSel.clear(); pantryBuy.clear(); extra = [];
      persist(); render(); toast("List cleared. Your plan and recipes are kept.");

function itemLi(it) {
  const li = el("li", "item"); const d = ticked.has(it.key); li.classList.toggle("done", d);
  const lab = el("label"); const cb = el("input"); cb.type = "checkbox"; cb.checked = d; cb.setAttribute("aria-label", it.name);
  const nm = el("span", "nm", it.name);
  const detail = it.extra || it.ess ? "" : (it.unit === "g" || it.unit === "ml" ? "uses " + Math.round(it.need) + " " + it.unit : "") + (it.from.length ? (it.unit === "g" || it.unit === "ml" ? " · " : "") + it.from.slice(0, 2).join(", ") + (it.from.length > 2 ? " +" + (it.from.length - 2) : "") : "");
  if (detail) nm.append(el("small", null, detail));
  lab.append(cb, nm);
  cb.addEventListener("change", () => { cb.checked ? ticked.add(it.key) : ticked.delete(it.key); persist(); rr(); });

  if (it.count > 1) li.append(el("span", "ct", "× " + it.count));

  li.append(x);
  return li;
}

  box.append(el("p", "hint", wk.length ? wk.map((e) => e.name).join(", ") : "Tap the star on an item below to build a list you can tick in one go."));
  main.append(box);
  const cats = [...new Set(list.map((e) => e.cat))];
  for (const c of cats) {
    main.append(el("h3", null, c));
    for (const e of list.filter((x) => x.cat === c)) {
      const row = el("div", "crow"); const on = essSel.has(e.id);
      const cb = el("input"); cb.type = "checkbox"; cb.checked = on; cb.setAttribute("aria-label", e.name);
      const g = el("div", "grow"); g.append(el("div", null, e.name));
      if (on) {
        const n = el("input"); n.type = "text"; n.value = essNotes[e.id] || ""; n.placeholder = e.ph || "Brand or type (optional)"; n.setAttribute("aria-label", "Brand or type for " + e.name);
        n.addEventListener("input", () => { essNotes[e.id] = n.value; persist(); }); g.append(n);
      }
      cb.addEventListener("change", () => { cb.checked ? essSel.set(e.id, weekly.get(e.id) || 1) : essSel.delete(e.id); persist(); rr(); });
      row.append(cb, g);
      if (on) {
        const st = el("div", "stepper"); const dn = el("button", null, "−"), up = el("button", null, "+"); dn.type = up.type = "button";
        dn.setAttribute("aria-label", "Fewer"); up.setAttribute("aria-label", "More");
        dn.addEventListener("click", () => { essSel.set(e.id, Math.max(1, essSel.get(e.id) - 1)); persist(); rr(); }); up.addEventListener("click", () => { essSel.set(e.id, Math.min(20, essSel.get(e.id) + 1)); persist(); rr(); });
        st.append(dn, el("span", null, String(essSel.get(e.id))), up); row.append(st);
      }
      const star = el("button", "star"); star.type = "button"; star.innerHTML = STAR; star.setAttribute("aria-pressed", String(weekly.has(e.id))); star.setAttribute("aria-label", weekly.has(e.id) ? "Remove from weekly list" : "Add to weekly list");
      star.addEventListener("click", () => { weekly.has(e.id) ? weekly.delete(e.id) : weekly.set(e.id, essSel.get(e.id) || 1); persist(); rr(); });
      row.append(star); main.append(row);
    }
  }
  main.append(el("h3", null, "Add your own item"));
  const ar = el("div", "addrow"); const inp = el("input"); inp.type = "text"; inp.id = "ess-add"; inp.placeholder = "e.g. Cat food"; inp.setAttribute("aria-label", "New extra item");
  const ab = el("button", "btn", "Add"); ab.type = "button";
  ab.addEventListener("click", () => { const v = inp.value.trim(); if (!v) return; const id = "u" + Date.now().toString(36); essCustom.push({ id, name: v, query: v }); essSel.set(id, 1); persist(); rr(); });
  ar.append(inp, ab); main.append(ar);
}

// ---------- More: use up leftovers, pantry, backup ----------
function viewMore(main) {
  main.append(el("h2", null, "Use up what’s left"));
  const { lo, list } = suggestions();
  const seg = el("div", "chips");
  [["all", "Any meal"], ...Object.entries(MEAL_LABEL)].forEach(([v, l]) => { const c = el("button", "chip", l); c.type = "button"; c.setAttribute("aria-pressed", String(ccMeal === v)); c.addEventListener("click", () => { ccMeal = v; rr(); }); seg.append(c); });
  main.append(seg);
  main.append(el("p", "hint", !selected.size ? "Pick some meals first. This shows meals that would use up what’s left in the packs you’re buying."
    : !lo.size ? "Nothing much left over from your picks." : "Left over from your picks: " + [...lo.values()].map((l) => l.name + " (" + (l.unit === "g" || l.unit === "ml" ? Math.round(l.left) + " " + l.unit : fmtNum(l.left) + " left") + ")").join(", ")));
  const ul = el("ul", "cc");
  list.slice(0, 12).forEach(({ r, used, extra: ex, servings }) => {
    const li = el("li"); const h = el("div", "head"); const nm = el("div", "rname", r.name); nm.append(el("span", "tag", MEAL_LABEL[r.meal] + " · " + TIER_LABEL[r.tier]));
    if (servings !== r.servings) nm.append(el("span", "tag", "for " + servings));
    const add = el("button", "btn small", "+ Add"); add.type = "button";
    add.addEventListener("click", () => {
      selected.set(r.id, servings); const sw = used.filter((x) => x.swap);
      if (sw.length) swaps.set(r.id, new Map(sw.map((x) => [ingKey(x.ing), { query: x.l.query, name: x.l.name, pack: x.l.pack, unit: x.l.unit, orig: x.ing.name }])));
      persist(); rr(); toast(r.name + " added to your picks");
    });
    h.append(nm, add); li.append(h);
    li.append(el("p", null, "Uses: " + used.map((x) => x.swap ? x.l.name + " (instead of " + x.ing.name + ")" : x.ing.name).join(", ")));
    li.append(ex.length ? el("p", null, "Still need " + ex.length + ": " + ex.slice(0, 4).map((x) => x.name).join(", ") + (ex.length > 4 ? ", +" + (ex.length - 4) + " more" : "")) : el("p", "free", "Nothing else to buy!"));
    ul.append(li);
  });
  main.append(ul);
  if (lo.size && !list.length) main.append(el("p", "hint", "No other meals fit right now. Try “Any meal”."));

  main.append(el("h2", null, "Pantry"));
  main.append(el("p", "hint", "Things you always have. They stay off your list (you can still tick them in a recipe to buy anyway)."));
  const pw = el("div", "pantry");
  [...pantry].sort().forEach((n) => { const c = el("button", "chip", n + " ✕"); c.type = "button"; c.setAttribute("aria-label", "Remove " + n + " from pantry"); c.addEventListener("click", () => { pantry.delete(n); pantryBuy.delete(n); persist(); rr(); }); pw.append(c); });
  if (!pantry.size) pw.append(el("span", "hint", "Nothing yet."));
  main.append(pw);
  const sug = new Set(); const HINT = /flour|sugar|soy sauce|^garlic|cumin|paprika|garam|curry powder|tomato puree|vinegar|stock|mustard|nutmeg|cinnamon|chilli flakes|honey|maple|dijon|worcestershire|star anise|yeast|cocoa|vanilla|mirin|sesame|salt|pepper|oil/i;
  all().forEach((r) => r.ingredients.forEach((i) => { const n = pantryName(i); if (HINT.test(n) && !pantry.has(n)) sug.add(n); }));
  if (sug.size) { main.append(el("h3", null, "Tap to add")); const sw = el("div", "pantry"); [...sug].sort().slice(0, 16).forEach((n) => { const c = el("button", "chip", "+ " + n); c.type = "button"; c.addEventListener("click", () => { pantry.add(n); persist(); rr(); }); sw.append(c); }); main.append(sw); }
  const pa = el("div", "addrow"); const pi = el("input"); pi.type = "text"; pi.id = "pantry-add"; pi.placeholder = "Add a pantry item"; pi.setAttribute("aria-label", "Add a pantry item");
  const pb = el("button", "btn", "Add"); pb.type = "button"; pb.addEventListener("click", () => { const v = pi.value.trim().toLowerCase(); if (!v) return; pantry.add(v); persist(); rr(); });
  pa.append(pi, pb); main.append(pa);

  main.append(el("h2", null, "Backup and moving between devices"));
  main.append(el("p", "hint", "Signed in, your plan and lists sync between your devices automatically. You can also copy everything as text and paste it somewhere safe."));
  const bk = el("div", "hrow"); bk.style.flexWrap = "wrap";
  const ex = el("button", "btn small", "Copy backup"); ex.type = "button";
  ex.addEventListener("click", async () => { try { await navigator.clipboard.writeText(JSON.stringify({ app: "meal-cart-planner", data: snapshot() })); toast("Backup copied"); } catch (_) { toast("Couldn’t copy here"); } });
  bk.append(ex); main.append(bk);
  const ta = el("textarea"); ta.id = "restore"; ta.rows = 3; ta.placeholder = "Paste a backup here to restore it"; ta.style.marginTop = "8px"; main.append(ta);
  const rs = el("button", "btn small", "Restore from pasted backup"); rs.type = "button"; rs.style.marginTop = "6px";
  const msg = el("p", "hint"); msg.setAttribute("role", "status");
  rs.addEventListener("click", () => {
    try { const o = JSON.parse(ta.value); if (!o || o.app !== "meal-cart-planner" || typeof o.data !== "object") throw 0;
      if (!rs.dataset.sure) { rs.dataset.sure = 1; rs.textContent = "Tap again to replace everything saved here"; return; }
      hydrate(o.data); persist(); render(); toast("Backup restored"); } catch (_) { msg.textContent = "That doesn’t look like a Meal Cart backup."; }
  });
  main.append(rs, msg);
  const note = el("p", "hint", "Tip: on iPhone or Android, use Share or the browser menu → Add to Home Screen to open this like an app."); main.append(note);
}

(async function start() {
  render();
  await loadAll();
  render();
})();
</script>
